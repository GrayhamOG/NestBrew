[phases.setup]
nixPkgs = ["php82", "php82Extensions.pdo_mysql", "php82Extensions.mbstring", "php82Extensions.tokenizer", "php82Extensions.xml", "php82Extensions.ctype", "php82Extensions.fileinfo", "php82Extensions.bcmath", "php82Extensions.curl"]
 
[phases.install]
cmds = ["composer install --no-dev --optimize-autoloader"]
 
[phases.build]
cmds = ["php artisan storage:link"]
 
[start]
cmd = "php -S 0.0.0.0:$PORT -t public"
 